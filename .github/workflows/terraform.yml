# Infrastructure pipeline
#   Pull request -> security scan + plan for dev and prod (shows what WOULD change)
#   Merge to main -> apply to dev
name: Terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request a short-lived OIDC token from GitHub
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  security-scan:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          compact: true

  plan:
    name: Plan (${{ matrix.environment }})
    needs: security-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan: ${{ matrix.environment }}"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-dev:
    name: Apply (dev)
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color -lock-timeout=5m

      - name: Show app URL
        run: |
          echo "App URL: $(terraform output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"
