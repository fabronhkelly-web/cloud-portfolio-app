<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Tracker</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#647084; --line:#e2e6ec; --accent:#ff9900; --accent-ink:#1d2330; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#232f3e; color:#fff; padding:20px 16px; }
    header .wrap { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    h1 { margin:0; font-size:1.4rem; }
    .badge { background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:4px 12px; font-size:.8rem; font-weight:600; }
    .wrap { max-width:860px; margin:0 auto; }
    main { padding:24px 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
    form.add { display:flex; gap:10px; flex-wrap:wrap; }
    input { flex:1 1 200px; padding:10px; border:1px solid var(--line); border-radius:6px; font-size:1rem; }
    button { padding:10px 18px; background:var(--accent); color:var(--accent-ink); border:0; border-radius:6px; font-weight:600; cursor:pointer; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-size:.85rem; font-weight:600; }
    select { padding:6px; border-radius:6px; border:1px solid var(--line); }
    .empty { color:var(--muted); }
    footer { color:var(--muted); font-size:.85rem; text-align:center; padding:16px; }
  </style>
</head>
<body>
  <header><div class="wrap">
    <h1>Job Application Tracker</h1>
    <span class="badge">env: {{ env }}</span>
  </div></header>
  <main class="wrap">
    <section class="card">
      <form class="add" method="post" action="/jobs">
        <input name="company" placeholder="Company" required maxlength="100">
        <input name="role" placeholder="Role (e.g. Cloud Engineer)" required maxlength="100">
        <button type="submit">Add application</button>
      </form>
    </section>
    <section class="card">
      {% if jobs %}
      <table>
        <thead><tr><th>Company</th><th>Role</th><th>Status</th></tr></thead>
        <tbody>
        {% for job in jobs %}
          <tr>
            <td>{{ job.company }}</td>
            <td>{{ job.role }}</td>
            <td>
              <form method="post" action="/jobs/{{ job.id }}/status">
                <select name="status" onchange="this.form.submit()" aria-label="Status for {{ job.company }}">
                  {% for s in statuses %}<option {% if s == job.status %}selected{% endif %}>{{ s }}</option>{% endfor %}
                </select>
              </form>
            </td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p class="empty">No applications yet. Add your first one above.</p>
      {% endif %}
    </section>
  </main>
  <footer>Running on AWS ECS Fargate &middot; RDS Postgres &middot; deployed by GitHub Actions + Terraform</footer>
</body>
</html>
